# Offline checks for every push and PR: the Python builder, the hosted engine (typecheck + parity tests against
# the Python replay on synthetic repos), and that the committed viewer builds and site pages match their sources.
# Upstream and PRs to it only: repos made from the template just build their city (commit-city.yml).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    if: github.repository == 'azank1/commit-city'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests

  web:
    if: github.repository == 'azank1/commit-city'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  viewer:
    if: github.repository == 'azank1/commit-city'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            viewer/package-lock.json
            web/package-lock.json
      - run: npm ci
        working-directory: viewer
      - run: npm ci
        working-directory: web
      - run: node viewer/build.mjs
      - run: node web/scripts/site.mjs
      - name: committed builds are up to date
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
